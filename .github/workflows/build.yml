name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ZIP entpacken
        shell: bash
        run: |
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "### FEHLER: Keine ZIP-Datei im Projekt gefunden. Bitte die ZIP hochladen." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Nutze $ZIP"
          mkdir project
          unzip -q "$ZIP" -d project
          GRADLE_FILE=$(find project -maxdepth 3 -name build.gradle | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "### FEHLER: build.gradle wurde in der ZIP nicht gefunden." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$GRADLE_FILE")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Mod bauen
        shell: bash
        run: |
          set -o pipefail
          gradle build --stacktrace --console=plain -p "$PROJECT_DIR" 2>&1 | tee build.log

      - name: Fehlertext anzeigen
        if: failure()
        shell: bash
        run: |
          {
            echo "## Build fehlgeschlagen - diesen Text kopieren und an Claude schicken"
            echo '```'
            grep -E "error:|\.java:[0-9]+|What went wrong|Could not|FAILURE" -A2 build.log | head -n 60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: juliusschneider-auction-mod
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
